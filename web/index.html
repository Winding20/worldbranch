<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WorldBranch · 平行世界推演实验室</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">WB</span>
      <div>
        <h1>WorldBranch</h1>
        <p>平行世界推演实验室</p>
      </div>
    </div>
    <div class="branch-meta" id="branchMeta">
      <span class="chip" id="chipDate">—</span>
      <span class="chip" id="chipPrecision">—</span>
      <span class="chip" id="chipTick">—</span>
    </div>
  </header>

  <main class="layout">
    <section class="map-panel">
      <div class="map-toolbar">
        <div class="zoom-group">
          <button id="zoomIn" title="放大">＋</button>
          <button id="zoomOut" title="缩小">－</button>
          <button id="zoomReset" title="复位">⟲</button>
        </div>
        <div class="scale-group">
          <label for="scopeSelect">观察尺度</label>
          <select id="scopeSelect">
            <option value="world">世界级</option>
            <option value="nation">国家级</option>
            <option value="region" selected>地区级</option>
            <option value="local">局部级</option>
          </select>
        </div>
        <div class="legend" id="legend"></div>
      </div>
      <div class="map-wrap" id="mapWrap">
        <svg id="map" viewBox="0 0 900 620" preserveAspectRatio="xMidYMid meet">
          <g id="mapLayer"></g>
        </svg>
        <div class="map-hint">滚轮缩放 · 拖拽平移 · 点击地区查看详情</div>
      </div>
    </section>

    <aside class="side-panel">
      <div class="panel-block">
        <h2>模拟控制</h2>
        <div class="precision-grid" id="precisionGrid">
          <button data-precision="macro"><b>宏观推演</b><span>国家与地区关系</span></button>
          <button data-precision="standard" class="active"><b>标准模拟</b><span>重要地区与势力</span></button>
          <button data-precision="fine"><b>精细模拟</b><span>地方经济与人物</span></button>
          <button data-precision="deep"><b>深度模拟</b><span>个体与局部交互</span></button>
        </div>
        <div class="advance-row">
          <button class="advance" data-months="1">推进 1 月</button>
          <button class="advance" data-months="3">推进 3 月</button>
          <button class="advance" data-months="12">推进 12 月</button>
        </div>
        <p class="hint" id="advanceHint">底层按规则逐月计算，不是整段交给 AI 总结。</p>
      </div>

      <div class="panel-block" id="regionBlock">
        <h2>地区详情</h2>
        <div id="regionDetail" class="empty">点击地图上的地区</div>
      </div>

      <div class="panel-block grow">
        <h2>事件流 <span class="count" id="eventCount">0</span></h2>
        <div class="event-list" id="eventList"></div>
      </div>
    </aside>
  </main>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
