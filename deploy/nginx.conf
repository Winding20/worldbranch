# WorldBranch 反向代理
#
# 放到 /etc/nginx/conf.d/worldbranch.conf，把 server_name 改成你的域名。
# 证书用 certbot 申请后会自动补上 443 段的配置。

server {
    listen 80;
    server_name example.com;

    # 决策材料与知识库上传都走 JSON，给一点余量
    client_max_body_size 10m;

    # 静态产物直接由 nginx 发，省一次 Python 往返
    location /app/assets/ {
        alias /www/wwwroot/worldbranch/frontend/dist/assets/;
        expires 7d;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:5210;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # AI 分析可能较慢，超时要给足
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}