name: debug-ci

# 临时用途：把 ci.py 的完整输出写回仓库的一个分支，
# 便于在没有 token 的情况下读取失败原因。用完即删。

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/debug.yml"

permissions:
  contents: write

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 安装依赖
        run: |
          pip install -r backend/requirements.txt
          cd frontend && npm install --ignore-scripts

      - name: 跑 ci.py 并记录全部输出
        run: |
          set +e
          python -u tools/ci.py > ci.log 2>&1
          code=$?
          echo "exit=$code" >> ci.log
          echo "exit code: $code"
          exit 0

      - name: 把日志推到 ci-log 分支
        run: |
          git config user.name "ci-debug"
          git config user.email "ci-debug@users.noreply.github.com"
          git checkout --orphan ci-log 2>/dev/null || git checkout ci-log
          git rm -rf --cached . >/dev/null 2>&1 || true
          cp ci.log /tmp/ci.log
          find . -maxdepth 1 -mindepth 1 ! -name .git -exec rm -rf {} +
          cp /tmp/ci.log ci.log
          git add -f ci.log
          git commit -m "ci log: $(date -u +%FT%TZ)"
          git push -f origin ci-log